<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification 2FA — GEC</title>
  <link href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/design-system.css') }}" rel="stylesheet">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <script>(function(){ if(localStorage.getItem('gec-dark')==='1') document.documentElement.classList.add('dark'); })();</script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #312e81 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,.4);
    }
    .auth-header {
      background: linear-gradient(135deg, var(--primary), #1e3a8a);
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .auth-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255,255,255,.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }
    .auth-body {
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .totp-input {
      width: 100%;
      text-align: center;
      font-size: 2rem;
      font-family: monospace;
      font-weight: 700;
      letter-spacing: .5rem;
      padding: .875rem 1rem;
      background: var(--body-bg);
      border: 2px solid var(--border);
      border-radius: var(--r-md);
      color: var(--t-primary);
      outline: none;
      transition: border-color .2s;
      box-sizing: border-box;
    }
    .totp-input:focus { border-color: var(--primary); }
    .submit-btn {
      width: 100%;
      padding: .875rem 1rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--r-md);
      font-size: .9375rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      transition: opacity .2s, transform .1s;
    }
    .submit-btn:hover { opacity: .9; transform: translateY(-1px); }
    .submit-btn:active { transform: translateY(0); }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: .375rem;
      font-size: .8125rem;
      color: rgba(255,255,255,.6);
      text-decoration: none;
      transition: color .2s;
    }
    .back-link:hover { color: white; }
    .timer-ring {
      display: inline-flex;
      align-items: center;
      gap: .375rem;
      font-size: .75rem;
      color: var(--t-muted);
    }
  </style>
</head>
<body>
<div class="auth-card">
  <div class="auth-header">
    <div class="auth-icon">
      <i class="fas fa-shield-alt" style="color:white;font-size:1.75rem;"></i>
    </div>
    <h1 style="font-size:1.125rem;font-weight:700;color:white;margin-bottom:.375rem;">Double Authentification</h1>
    <p style="font-size:.8125rem;color:rgba(255,255,255,.75);">Saisissez le code à 6 chiffres de votre application d'authentification</p>
  </div>

  <div class="auth-body">

    {% if error %}
    <div class="gec-alert gec-alert-danger">
      <i class="fas fa-exclamation-circle"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" autocomplete="off" style="display:flex;flex-direction:column;gap:1rem;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label style="display:block;font-size:.8125rem;font-weight:600;color:var(--t-secondary);margin-bottom:.5rem;text-align:center;">
          <i class="fas fa-mobile-alt" style="margin-right:.375rem;color:var(--primary);"></i>Code TOTP
        </label>
        <input type="text" name="token" inputmode="numeric" pattern="[0-9 ]{6,7}"
               maxlength="7" autofocus autocomplete="one-time-code"
               placeholder="000 000"
               class="totp-input">
        <div style="text-align:center;margin-top:.5rem;" class="timer-ring">
          <i class="fas fa-sync-alt" style="animation:spin 30s linear infinite;"></i>
          Le code se renouvelle toutes les 30 secondes
        </div>
      </div>

      <button type="submit" class="submit-btn">
        <i class="fas fa-check-circle"></i>
        Vérifier le code
      </button>
    </form>

    <div style="text-align:center;padding-top:.25rem;">
      <a href="{{ url_for('login') }}" class="back-link">
        <i class="fas fa-arrow-left"></i>
        Retour à la connexion
      </a>
    </div>

  </div>
</div>

<script>
document.querySelector('input[name="token"]')?.addEventListener('input', function() {
  let v = this.value.replace(/\D/g, '').slice(0, 6);
  this.value = v.length > 3 ? v.slice(0,3) + ' ' + v.slice(3) : v;
});
</script>
<style>
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</body>
</html>
