<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ code }} — {{ title }} — GEC</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}" rel="stylesheet">
  <style>
    /* Page d'erreur AUTONOME : aucune dépendance DB/session, fonctionne même en cas de 500 */
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;
      background:radial-gradient(1200px 600px at 50% -10%,#1e293b 0%,#0f172a 45%,#020617 100%);
      color:#e2e8f0;-webkit-font-smoothing:antialiased;
    }
    .wrap{max-width:560px;width:100%;text-align:center;display:flex;flex-direction:column;gap:1.5rem}
    .code{
      font-size:7rem;font-weight:900;line-height:1;letter-spacing:-.03em;
      background:linear-gradient(135deg,#60a5fa,#a78bfa 55%,#f472b6);
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    }
    .card{
      background:rgba(30,41,59,.55);border:1px solid rgba(148,163,184,.18);
      border-radius:18px;padding:1.75rem 1.5rem;backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,.45);
      display:flex;flex-direction:column;gap:1rem;
    }
    .icon{
      width:58px;height:58px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,rgba(96,165,250,.2),rgba(167,139,250,.2));
      border:1px solid rgba(148,163,184,.25);color:#93c5fd;font-size:1.4rem;
    }
    h1{font-size:1.35rem;font-weight:700;color:#f8fafc}
    .msg{font-size:.95rem;color:#cbd5e1;line-height:1.6}
    .url-box{
      text-align:left;background:rgba(2,6,23,.5);border:1px solid rgba(148,163,184,.15);
      border-radius:10px;padding:.75rem .9rem;
    }
    .url-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:#64748b;margin-bottom:.35rem;font-weight:600}
    .url-val{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;color:#93c5fd;word-break:break-all;line-height:1.5}
    .actions{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
    .btn{
      display:inline-flex;align-items:center;gap:.45rem;text-decoration:none;cursor:pointer;
      padding:.7rem 1.15rem;border-radius:10px;font-size:.875rem;font-weight:600;border:1px solid transparent;transition:transform .15s,filter .15s;
    }
    .btn:hover{transform:translateY(-2px)}
    .btn-primary{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff}
    .btn-ghost{background:rgba(148,163,184,.1);color:#e2e8f0;border-color:rgba(148,163,184,.25)}
    .foot{font-size:.75rem;color:#475569}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">{{ code }}</div>
    <div class="card">
      <div class="icon"><i class="fas {{ icon or 'fa-triangle-exclamation' }}"></i></div>
      <h1>{{ title }}</h1>
      <p class="msg">{{ message }}</p>

      {% if error_url %}
      <div class="url-box">
        <div class="url-label"><i class="fas fa-link" style="margin-right:.35rem;"></i>Adresse concernée</div>
        <div class="url-val">{{ error_url }}</div>
      </div>
      {% endif %}
    </div>

    <div class="actions">
      <a href="{{ url_for('login') }}" class="btn btn-primary"><i class="fas fa-right-to-bracket"></i> Retour à la connexion</a>
      <a href="{{ url_for('dashboard') }}" class="btn btn-ghost"><i class="fas fa-house"></i> Tableau de bord</a>
      <a href="javascript:history.back()" class="btn btn-ghost"><i class="fas fa-arrow-left"></i> Page précédente</a>
    </div>

    <div class="foot">GEC — Gestion Électronique du Courrier</div>
  </div>
</body>
</html>
