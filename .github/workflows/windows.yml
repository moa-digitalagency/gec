name: Windows Server

# GEC est déployé chez des clients sous Windows Server. Ce job reproduit ce qui
# ne se voit pas sous Linux : encodage régional cp1252, impossibilité de supprimer
# un fichier ouvert, PowerShell 5.1.
# Aucune donnée externe (titre de PR, message de commit...) n'est interpolée.
on:
  push:
    branches: ["main", "feat/windows-server-2016"]
  pull_request:
  workflow_dispatch:

jobs:
  tests-windows:
    name: Tests sous Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Encodage régional (doit être cp1252, comme sur Windows Server)
        run: python -c "import locale, sys; print(locale.getpreferredencoding(False), 'utf8_mode =', sys.flags.utf8_mode)"

      - name: Tests propres à Windows
        run: python -m pytest -p no:cacheprovider -v tests/test_fichiers_dechiffres.py tests/test_encodage_texte.py
