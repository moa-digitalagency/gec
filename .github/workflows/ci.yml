name: CI — GEC

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # 1. LINT & FORMAT
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install black isort flake8

      - name: Black (format check)
        run: black --check --diff .

      - name: isort (import order)
        run: isort --check-only --diff .

      - name: Flake8 (style)
        run: flake8 . --max-line-length=120 --exclude=venv,.venv,migrations

  # ─────────────────────────────────────────────
  # 2. SECURITY AUDIT
  # ─────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit tools
        run: pip install bandit pip-audit

      - name: Bandit (static security analysis)
        run: bandit -r . -x ./venv,./.venv,./tests -ll

      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit -r requirements.txt

  # ─────────────────────────────────────────────
  # 3. TESTS
  # ─────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gec_test
          POSTGRES_PASSWORD: gec_test_pass
          POSTGRES_DB: gec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://gec_test:gec_test_pass@localhost:5432/gec_test
      SESSION_SECRET: ci-test-secret-key-not-for-production
      GEC_MASTER_KEY: ci-test-master-key-32-chars-minimum!
      GEC_PASSWORD_SALT: ci-test-password-salt
      FLASK_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=30

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
